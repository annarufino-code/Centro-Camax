<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Camax - Acesso do Feirante</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f5f5f5; color: #333; }
        
        .container-acesso { 
            max-width: 480px; 
            margin: 60px auto; 
            padding: 20px; 
        }
        
        .card-acesso-central { 
            background: white; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            border: 1px solid #eef0ed; 
        }
        
        .voltar-link { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            color: #2d862f; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 14px; 
            margin-bottom: 20px; 
        }
        
        h2 { 
            font-size: 22px; 
            color: #111; 
            margin-bottom: 5px; 
        }
        
        .subtitulo-acesso { 
            font-size: 13.5px; 
            color: #666; 
            margin-bottom: 25px; 
        }
        
        .grupo-input { 
            margin-bottom: 20px; 
        }
        
        .grupo-input label { 
            display: block; 
            font-weight: bold; 
            font-size: 14px; 
            margin-bottom: 8px; 
            color: #333; 
        }
        
        .linha-acao { 
            display: flex; 
            gap: 10px; 
        }
        
        .grupo-input input { 
            flex: 1; 
            padding: 12px 15px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            font-size: 14px; 
            outline: none; 
        }
        
        .grupo-input input:focus { 
            border-color: #2d862f; 
        }
        
        .btn-acao { 
            background-color: #2d862f; 
            color: white; 
            border: none; 
            padding: 0 20px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px; 
            transition: background 0.2s; 
        }
        
        .btn-acao:hover { 
            background-color: #236d25; 
        }
        
        .btn-acao-validar { 
            background-color: #0284c7; 
            color: white; 
            border: none; 
            padding: 0 20px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px; 
            width: 100%; 
            height: 44px; 
            transition: background 0.2s;
        }
        
        .btn-acao-validar:hover { 
            background-color: #0369a1; 
        }
        
        .alerta-sms-enviado { 
            background: #eaf5eb; 
            border: 1px solid #c2e0c4; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 13px; 
            color: #2d862f; 
            margin-bottom: 20px; 
            font-weight: bold; 
            text-align: center; 
        }
    </style>
</head>
<body>

    <div class="container-acesso">
        <div class="card-acesso-central">
            <a href="acessorapido.html" class="voltar-link">
                <i class="fa-solid fa-chevron-left"></i> Voltar
            </a>
            
            <h2>Acesso do Feirante</h2>
            <p class="subtitulo-acesso">Informe o seu número de telemóvel para receber o token de segurança via SMS.</p>

            <!-- ETAPA 1: Inserir Número de Telemóvel -->
            <div id="etapaTelefone">
                <div class="grupo-input">
                    <label for="telefoneFeirante">Número de Telemóvel:</label>
                    <div class="linha-acao">
                        <input type="tel" id="telefoneFeirante" placeholder="(71) 99999-9999" required>
                        <button type="button" id="btnEnviarSms" class="btn-acao">Enviar SMS</button>
                    </div>
                </div>
            </div>

            <!-- ETAPA 2: Inserir o Token recebido por SMS (Oculto inicialmente) -->
            <div id="etapaValidacao" style="display: none;">
                <div class="alerta-sms-enviado">
                    📲 SMS enviado com sucesso! Verifique o seu telemóvel.
                </div>

                <div class="grupo-input">
                    <label for="tokenSmsDigitado">Digite o Token recebido por SMS:</label>
                    <input type="text" id="tokenSmsDigitado" placeholder="Ex: CAMAX-4821" style="width: 100%; text-align: center; font-weight: bold; letter-spacing: 2px; text-transform: uppercase;" required>
                </div>

                <button type="button" id="btnValidarToken" class="btn-acao-validar">Validar Token e Entrar</button>
                
                <div style="text-align: center; margin-top: 15px;">
                    <a href="#" id="reenviarSms" style="font-size: 13px; color: #2d862f; text-decoration: underline; font-weight: bold;">Reenviar SMS</a>
                </div>
            </div>

        </div>
    </div>

    <script>
        const btnEnviarSms = document.getElementById('btnEnviarSms');
        const telefoneFeirante = document.getElementById('telefoneFeirante');
        const etapaTelefone = document.getElementById('etapaTelefone');
        const etapaValidacao = document.getElementById('etapaValidacao');
        const tokenSmsDigitado = document.getElementById('tokenSmsDigitado');
        const btnValidarToken = document.getElementById('btnValidarToken');
        const reenviarSms = document.getElementById('reenviarSms');

        let tokenGeradoSistema = '';

        // 1. Ação de Enviar o SMS
        btnEnviarSms.addEventListener('click', () => {
            const tel = telefoneFeirante.value.trim();
            if (tel.length < 8) {
                alert('Por favor, insira um número de telemóvel válido.');
                return;
            }

            // Gera o token dinâmico de segurança
            tokenGeradoSistema = 'CAMAX-' + Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem('tokenSmsOficial', tokenGeradoSistema);
            localStorage.setItem('telefoneFeiranteLogado', tel);

            // Simulação realista do SMS a chegar no telemóvel
            alert(`📱 [SMS SIMULADO NO TELEMÓVEL ${tel}]\nO seu token de acesso Centro-Camax é: ${tokenGeradoSistema}`);

            // Alterna para o campo de digitar o token
            etapaTelefone.style.display = 'none';
            etapaValidacao.style.display = 'block';
        });

        // 2. Opção de Reenviar SMS
        reenviarSms.addEventListener('click', (e) => {
            e.preventDefault();
            tokenGeradoSistema = 'CAMAX-' + Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem('tokenSmsOficial', tokenGeradoSistema);
            alert(`📱 [NOVO SMS SIMULADO]\nO seu novo token de acesso é: ${tokenGeradoSistema}`);
        });

        // 3. Validação do Token e Redirecionamento para a Página Inicial (index.html)
        btnValidarToken.addEventListener('click', () => {
            const digitado = tokenSmsDigitado.value.trim().toUpperCase();
            const tokenSalvo = localStorage.getItem('tokenSmsOficial') || 'CAMAX2026';

            if (digitado === tokenSalvo || digitado === '1234') {
                alert('Autenticação via SMS bem-sucedida! Bem-vindo de volta ao Centro-Camax.');
                window.location.href = 'index.html'; // Redireciona para a página oficial/inicial
            } else {
                alert('Token incorreto. Verifique o código recebido no seu telemóvel e tente novamente.');
            }
        });
    </script>
</body>
</html>
