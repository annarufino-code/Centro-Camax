<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Feirante - Centro Camax</title>
    <link rel="stylesheet" href="feirante.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <header class="topo">
        <img src="imagens/Logo centroCamax.svg" alt="Centro Camax">
    </header>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
            <a href="index.html" class="voltar">
                <i class="fa-solid fa-right-from-bracket"></i> Sair do Painel
            </a>
            <button class="btn-verde" style="margin: 0; width: auto; padding: 10px 20px; height: 40px;" onclick="window.location.href='feirante.html'">
                <i class="fa-solid fa-pen-to-square"></i> Editar Espaço
            </button>
        </div>

        <h1 style="margin-top: 30px;">Meu Estabelecimento</h1>

        <div style="max-width: 600px; margin: 30px auto;">
            <div class="box-item-card" style="padding: 30px; background: #fff;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
                    <span class="box-item-badge" style="font-size: 16px; padding: 6px 14px;">Box 15</span>
                    <span style="background: #2d862f; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold;">Ativo</span>
                </div>
                
                <h2 style="font-size: 26px; margin-bottom: 10px; color: #000;">Barraca do João</h2>
                <p style="font-size: 16px; color: #666; margin-bottom: 20px; line-height: 1.5;">
                    Categoria: <strong>Alimentação</strong><br>
                    Especialidade em frutas, verduras e legumes frescos colhidos no dia direto para a sua mesa.
                </p>

                <div style="width: 100%; height: 200px; background: #ddd; border-radius: 8px; overflow: hidden;">
                    <div style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; color: #888;">
                        <i class="fa-regular fa-image" style="font-size: 40px;"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
