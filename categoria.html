<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Centro Camax - Filtro por Categoria</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f9f9f9; }
        .navbar { background: #2d862f; color: white; padding: 15px 4%; display: flex; align-items: center; justify-content: space-between; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .back-link { color: #2d862f; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 5px; margin-bottom: 25px; font-size: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .box-card { background: white; border: 1px solid #e0e0e0; border-radius: 12px; padding: 22px; box-shadow: 0 2px 5px rgba(0,0,0,0.01); display: flex; flex-direction: column; justify-content: space-between; }
        .badge { background: #dff4c9; color: #2d862f; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; align-self: flex-start; }
        .title { margin: 12px 0 6px 0; font-size: 18px; color: #000; font-weight: bold; }
        .desc { color: #666; font-size: 13.5px; margin-bottom: 15px; }
        .btn { width: 100%; height: 38px; background: #2d862f; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>CENTRO CAMAX</h2>
        <a href="index.html" style="color: white; text-decoration: none; font-weight: bold;">Início</a>
    </div>

    <div class="container">
        <a href="index.html" class="back-link"><i class="fa-solid fa-chevron-left"></i> Voltar para o Início</a>
        
        <h1 id="cat-title" style="color: #000; margin-bottom: 5px; text-transform: capitalize;">Categoria</h1>
        <p style="color: #666; margin-bottom: 30px;">Feirantes ativos cadastrados no sistema nesta categoria</p>

        <div class="grid" id="lista-filtrada"></div>
    </div>

    <script>
        // Banco de dados idêntico da index
        const listaBoxes = [
            { id: 1, nome: "Barraca do João", categoria: "Alimentação", box: "Box 15", desc: "Produtos frescos, selecionados com carinho para você e sua família." },
            { id: 2, nome: "Pastelaria Camaçari", categoria: "Alimentação", box: "Box 04", desc: "Pastéis fritos na hora com recheios variados e aquele caldo de cana gelado." },
            { id: 3, nome: "Moda & Estilo", categoria: "Roupas", box: "Box 45", desc: "O melhor da moda masculina, feminina e acessórios com ótimos preços." },
            { id: 4, nome: "Artes Nordestinas", categoria: "Artesanato", box: "Box 12", desc: "Lembranças locais, peças em cerâmica e decorações rústicas." },
            { id: 5, nome: "Adega Camax", categoria: "Bebidas", box: "Box 77", desc: "Sucos naturais, coquetéis, vinhos finos e destilados trincando." }
        ];

        function carregarFiltrados() {
            const params = new URLSearchParams(window.location.search);
            const cat = params.get('cat');
            
            const titulo = document.getElementById('cat-title');
            const container = document.getElementById('lista-filtrada');

            if(!cat) {
                titulo.innerText = "Nenhuma categoria especificada";
                return;
            }

            titulo.innerText = cat;
            const filtrados = listaBoxes.filter(b => b.categoria.toLowerCase() === cat.toLowerCase());

            if(filtrados.length === 0) {
                container.innerHTML = `<p style="color:#888; grid-column: 1/-1;">Nenhum box encontrado para esta categoria ainda.</p>`;
                return;
            }

            container.innerHTML = "";
            filtrados.forEach(box => {
                container.innerHTML += `
                    <div class="box-card">
                        <div>
                            <span class="badge">${box.box}</span>
                            <h3 class="title">${box.nome}</h3>
                            <p class="desc">${box.desc}</p>
                        </div>
                        <button class="btn" onclick="window.location.href='index.html'">Visualizar na Home</button>
                    </div>
                `;
            });
        }

        window.onload = carregarFiltrados;
    </script>
</body>
</html>
