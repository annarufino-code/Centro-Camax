<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Feirante - Centro Camax</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <header>
    <h1>Centro Camax</h1>
    <a href="index.html">← Voltar para a Home</a>
  </header>


  <main class="container">
    <!-- Card principal do feirante -->
    <section class="box-feirante">
      <img id="foto-box" src="imagem-padrao.jpg" alt="Foto do Box">
      
      <div class="info-box">
        <h2 id="nome-box">Nome do Box / Feirante</h2>
        <p id="categoria-box">Categoria: Verduras e Legumes</p>
        <p id="horario-box">Horário: Seg a Sáb - 07:00 às 17:00</p>
        <p id="descricao-box">Descrição dos produtos vendidos e localização no centro de compras.</p>
      </div>
    </section>
  </main>


  <!-- Arquivo de JavaScript que vai preencher/atualizar os dados no futuro -->
  <script src="script.js"></script>
</body>
</html>
