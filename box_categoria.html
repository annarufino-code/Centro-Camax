<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Camax - Categoria</title>
    <link rel="stylesheet" href="feirante.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .titulo-dinamico {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 20px;
            font-size: 32px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header class="topo">
        <img src="imagens/Logo centroCamax.svg" alt="Centro Camax">
    </header>

    <div class="container">
        <a href="index.html" class="voltar">
            <i class="fa-solid fa-chevron-left"></i> Voltar
        </a>

        <h1 id="nome-categoria" class="titulo-dinamico">Categoria</h1>

        <div id="render-boxes-grid" class="grid-boxes-container"></div>

        <div id="erro-nao-encontrado" class="box-salvo" style="display: none;">
            <span style="font-size: 20px;">Boxes não encontrados</span>
        </div>
    </div>

    <script>
        const mockDatabase = [
            { nome: "Barraca do João", categoria: "Alimentação", box: "Box 15", desc: "Frutas, verduras e legumes colhidos no dia." },
            { nome: "Pastelaria Camaçari", categoria: "Alimentação", box: "Box 04", desc: "Pastéis fritos na hora e caldo de cana gelado." },
            { nome: "Artes da Bahia", categoria: "Artesanato", box: "Box 42", desc: "Lembranças locais e decorações esculpidas à mão." },
            { nome: "Estilo & Cia", categoria: "Roupas", box: "Box 108", desc: "O melhor da moda masculina e feminina da feira." },
            { nome: "Bebidas Camax", categoria: "Bebidas", box: "Box 22", desc: "Distribuidora de bebidas em geral atacado e varejo." },
            { nome: "Chaveiro Central", categoria: "Serviços", box: "Box 09", desc: "Abertura de travas e cópias de chaves na hora." }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const categoriaSelecionada = urlParams.get('cat');

        if (categoriaSelecionada) {
            document.getElementById('nome-categoria').innerText = categoriaSelecionada;
            const boxesFiltrados = mockDatabase.filter(box => box.categoria.toLowerCase() === categoriaSelecionada.toLowerCase());
            const gridContainer = document.getElementById('render-boxes-grid');
            
            if(boxesFiltrados.length > 0) {
                boxesFiltrados.forEach(box => {
                    gridContainer.innerHTML += `
                        <div class="box-item-card">
                            <div>
                                <span class="box-item-badge">${box.box}</span>
                                <h3 style="margin-bottom:6px; color:#000;">${box.nome}</h3>
                                <p style="color:#555; font-size:14px; margin-bottom:15px;">${box.desc}</p>
                            </div>
                            <button class="btn-verde" style="margin-top:0; width:100%; height:42px; font-size:14px;">Ver Detalhes</button>
                        </div>
                    `;
                });
            } else {
                document.getElementById('erro-nao-encontrado').style.display = 'flex';
            }
        } else {
            document.getElementById('erro-nao-encontrado').style.display = 'flex';
        }
    </script>
</body>
</html>
